<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supporting Ball</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Шар Поддержки</h1>
        <div class="ball-container" id="ball">
            <div class="ball">
                <div class="window">
                    <div class="triangle">
                        <p id="message">Нажми на меня</p>
                    </div>
                </div>
            </div>
            <div class="shadow"></div>
        </div>
        <p class="instruction">Нажми на шар, чтобы получить поддержку</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
